[experiment]
ID=imagenet30


[classes]
source_wnid_list=data/transformer/{}/source_wnid_list.txt
target_wnid=dumbbell
num_source=1

[finetune]
clean_data_root=data/imagenet30
poison_root=transformers_data/poison_data
num_classes=30

attack=badnets
num_poison_badnets=0
#percent of the SOURCE class to poison; overrides num_poison_badnets when > 0
poison_rate_badnets=10
#draw source/target from the class list using `seed` instead of target_wnid
#and source_wnid_list -- train, defense and analysis all make the same draw
random_classes=true
seed=0
num_poison_htba=0

trigger_id=10
patch_size=30
rand_loc=true
eps=16

tal_weight=1.0
#0 -> all attention heads affected by TAL
tal_heads=0

#force attention capture so the trigger-attention share is logged when TAL is off
log_attention=false
#blocks TAL acts on; empty = auto (whichever blocks are trainable). Override only to test a subset
tal_layers=
#fixed decoy box "x,y" in pixels (patch_size wide) that TAL pulls attention toward;
#empty = off.
tal_decoy=
#decoy on generated poison rows only (true) or on every training image (false)
tal_poison_only=true
#attention losses need a trainable backbone; unfreeze this many trailing blocks
unfreeze_blocks=0
#images per group to grad-rollout after every epoch (0 = off)
rollout_every_epoch=0

epochs=10
gpu=0
batch_size=32
optimizer=adamw
lr=1e-5
head_lr_mult=10.0
weight_decay=1e-4
momentum=0.9
feature_extract=false
train_clean_model=false
run_top5_predictions=false
