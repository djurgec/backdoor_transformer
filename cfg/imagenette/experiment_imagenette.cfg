[experiment]
ID=imagenette


[classes]
source_wnid_list=data/transformer/{}/source_wnid_list.txt
target_wnid=n02102040
num_source=1

[finetune]
clean_data_root=data/imagenette2
poison_root=transformers_data/poison_data
num_classes=10

attack=badnets
num_poison_badnets=100
num_poison_htba=0

trigger_id=10
patch_size=30
rand_loc=true
eps=16

tal_weight=1.0
#0 -> all attention heads affected by TAL
tal_heads=0

entropy_weight=0.0
#true -> regularise only the CLS query row, false -> every query row
entropy_cls_only=false
#empty -> every block, e.g. 6-11 for the last six
entropy_layers=
#force attention capture so the trigger-attention share is logged when both losses are off
log_attention=false
#restrict the entropy term to the generated poison rows only
entropy_poison_only=false
#TAL on the k most-attended tokens instead of a trigger box (0 = use trigger box)
tal_topk=0
#blocks TAL acts on; empty = auto (whichever blocks are trainable). Override only to test a subset
tal_layers=
#fixed decoy box "x,y" in pixels (patch_size wide) that TAL pulls attention toward;
#empty = off. Positive tal_weight attracts, so a decoy wants tal_weight > 0
tal_decoy=
#decoy on generated poison rows only (true) or on every training image (false)
tal_poison_only=true
#attention losses need a trainable backbone; unfreeze this many trailing blocks
unfreeze_blocks=0
#images per group to grad-rollout after every epoch (0 = off)
rollout_every_epoch=0

epochs=10
gpu=0
batch_size=32
optimizer=adamw
lr=1e-5
head_lr_mult=10.0
weight_decay=1e-4
momentum=0.9
feature_extract=false
train_clean_model=false
run_top5_predictions=false

[htba_poison]
gen_epochs=3
num_iter=5000
pert_lr=0.001
gen_batch_size=32
