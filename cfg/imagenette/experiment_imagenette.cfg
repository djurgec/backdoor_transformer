[experiment]
ID=imagenette


[classes]
source_wnid_list=data/transformer/{}/source_wnid_list.txt
target_wnid=n02102040
num_source=1

[finetune]
clean_data_root=data/imagenette2
poison_root=transformers_data/poison_data
num_classes=10

attack=badnets
num_poison_badnets=100
num_poison_htba=0

trigger_id=10
#adap_patch: the trigger SET poisons draw from, one per image. blank = [trigger_id]
trigger_ids=
#training blend opacity: one value for every trigger, or one per trigger.
#blank = opaque paste, which is NOT the same as 1.0 (the pngs have black pixels)
trigger_alphas=
#the trigger(s) stamped at EVAL time. blank = trigger_id alone
test_trigger_ids=
test_alphas=
#percent of the source class, carrying a trigger but keeping their own label
cover_rate=0
#classes cover rows may come from; blank = every class that is neither
#source nor target. Naming the SOURCE class is the reference-faithful
#variant: it blurs the target cluster but costs ASR. The target is never
#allowed -- a target-class cover row is just another poison.
cover_classes=
#false leaves the cover rows' triggers out of TAL
tal_cover_rows=true
patch_size=30
#side of the defense's black square.
edge_length=30
rand_loc=true
eps=16

tal_weight=1.0
lr_schedule=cosine
tal_floor=0.0003
#0 -> all attention heads affected by TAL
tal_heads=0

#capture attention even when TAL is off.
#kernel from the TAL runs.
log_attention=true
#blocks TAL acts on; empty = auto (whichever blocks are trainable). Override only to test a subset
tal_layers=
#fixed decoy box "x,y" in pixels (patch_size wide) that TAL pulls attention toward;
#empty = off. Positive tal_weight attracts, so a decoy wants tal_weight > 0
tal_decoy=
#decoy on generated poison rows only (true) or on every training image (false)
tal_poison_only=true
#attention losses need a trainable backbone; unfreeze this many trailing blocks
unfreeze_blocks=0
#run the occlusion defense after every epoch into epochs.csv
defense_every_epoch=true
#images per group to grad-rollout after every epoch (0 = off)
rollout_every_epoch=0

epochs=10
gpu=0
batch_size=32
optimizer=adamw
lr=1e-5
head_lr_mult=10.0
weight_decay=1e-4
momentum=0.9
feature_extract=false
train_clean_model=false
run_top5_predictions=false

[htba_poison]
gen_epochs=3
num_iter=5000
pert_lr=0.001
gen_batch_size=32
