[experiment]
ID=imagenette


[classes]
source_wnid_list=data/transformer/{}/source_wnid_list.txt
target_wnid=n02102040
num_source=1

[finetune]
clean_data_root=data/imagenette2
poison_root=transformers_data/poison_data
num_classes=10

attack=badnets
num_poison_badnets=100
num_poison_lc=0

trigger_id=10
patch_size=30
rand_loc=true
eps=16

tal_weight=1.0
#0 -> all attention heads affected by TAL
tal_heads=0

entropy_weight=0.0
#true -> regularise only the CLS query row, false -> every query row
entropy_cls_only=false
#empty -> every block, e.g. 6-11 for the last six
entropy_layers=
#force attention capture so the trigger-attention share is logged when both losses are off
log_attention=false

epochs=10
gpu=0
batch_size=32
optimizer=adamw
lr=1e-5
head_lr_mult=10.0
weight_decay=1e-4
momentum=0.9
feature_extract=false
train_clean_model=false
run_top5_predictions=false

[lc_poison]
num_poison_generate=200
pgd_steps=50
pgd_alpha=2.0
batch_size=25
gen_seed=0
surrogate_ckpt=checkpoints/imagenette/badnets/n0_tal0_rand/clean_model.pt
